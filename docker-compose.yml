services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_ANALYSIS_SERVER_URL: ${VITE_ANALYSIS_SERVER_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      - traefik.http.routers.dashboard-cv-ut.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.dashboard-cv-ut.entrypoints=websecure
      - traefik.http.routers.dashboard-cv-ut.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.dashboard-cv-ut.loadbalancer.server.port=80
    networks:
      - app
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: ${PORT:-8081}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ANALYSIS_OUTPUT_ROOT: ${ANALYSIS_OUTPUT_ROOT:-/app/runtime-analysis}
      ANALYSIS_PYTHON_BIN: ${ANALYSIS_PYTHON_BIN:-/opt/venv/bin/python}
      ANALYSIS_DEFAULT_MODEL_PATH: ${ANALYSIS_DEFAULT_MODEL_PATH:-/app/models/detect-construction-safety-best.pt}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-cv_session}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_EXCHANGE_ENABLED: ${AUTH_SESSION_EXCHANGE_ENABLED:-false}
      AUTH_SESSION_EXCHANGE_KEY: ${AUTH_SESSION_EXCHANGE_KEY:-}
      AUTH_SESSION_RATE_LIMIT_WINDOW_MS: ${AUTH_SESSION_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_SESSION_RATE_LIMIT_MAX: ${AUTH_SESSION_RATE_LIMIT_MAX:-10}
      AUTH_TOKEN_VIEWER: ${AUTH_TOKEN_VIEWER:-}
      AUTH_TOKEN_OPERATOR: ${AUTH_TOKEN_OPERATOR:-}
      AUTH_TOKEN_ADMIN: ${AUTH_TOKEN_ADMIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ARTIFACT_URL_SECRET: ${ARTIFACT_URL_SECRET:-}
      ARTIFACT_URL_TTL_SECONDS: ${ARTIFACT_URL_TTL_SECONDS:-900}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-7}
      ARTIFACT_RETENTION_MAX_BYTES: ${ARTIFACT_RETENTION_MAX_BYTES:-10737418240}
    restart: unless-stopped
    volumes:
      - ${HOST_SERVER_DATA_DIR:-./server/data}:/app/server/data
      - ${HOST_RUNTIME_ANALYSIS_DIR:-./runtime-analysis}:/app/runtime-analysis
      - ${HOST_MODELS_DIR:-./models}:/app/models:ro
    networks:
      - app

networks:
  app:
    driver: bridge
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
